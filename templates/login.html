{% extends "base.html" %}

{% block title %}登录 - 土特产网络销售系统{% endblock %}

{% block content %}
<section class="auth-layout">
    <form class="panel form-panel" method="post">
        <h1>登录</h1>
        <label>
            用户名
            <input name="username" required autofocus>
        </label>
        <label>
            密码
            <input type="password" name="password" required>
        </label>
        <button type="submit">登录</button>
        <p class="form-note">默认管理员：admin / admin123</p>
        <p class="form-note">示例商家：seller01 / seller123；示例消费者：consumer01 / user123</p>
    </form>
</section>
{% endblock %}
